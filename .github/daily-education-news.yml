name: Daily Education News Feed

on:
  workflow_dispatch:
  schedule:
    # Daily at 08:00 India time (02:30 UTC)
    - cron: "30 2 * * *"

permissions:
  contents: read

jobs:
  fetch-and-publish-news:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: pip install requests
      - name: Fetch headlines from RSS and publish short attributed summaries
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/fetch_education_news.py
