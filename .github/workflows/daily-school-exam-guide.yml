name: Daily School Exam Guide Publishing

on:
  workflow_dispatch:
  schedule:
    # Daily at 06:00 AM India time (00:30 UTC)
    - cron: "30 0 * * *"

permissions:
  contents: read

concurrency:
  group: daily-school-exam-guide
  cancel-in-progress: false

jobs:
  publish-education:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: pip install requests

      - name: Publish one AI-generated Hindi study article
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
          # Daily original study guide is published automatically after quality checks.
          AUTO_PUBLISH_STUDY_GUIDES: "true"
          GEMINI_FALLBACK_MODEL: gemini-3.5-flash-lite

        run: python scripts/publish_school_article.py
