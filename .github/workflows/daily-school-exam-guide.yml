name: Daily School Exam Guide Publishing

on:
  workflow_dispatch:
  schedule:
    # Daily at 08:30 AM India time (03:00 UTC)
    - cron: "0 3 * * *"

permissions:
  contents: read

jobs:
  publish-education:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: pip install requests
      - name: Publish one prepared study article
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/publish_school_article.py
