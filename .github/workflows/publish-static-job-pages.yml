name: Publish AdSense-ready static job pages

on:
  push:
    branches: [main]
    paths:
      - "scripts/generate_job_pages.py"
      - "scripts/generate_job_sitemap.py"
      - ".github/workflows/publish-static-job-pages.yml"
      - "index.html"
      - "app.js"
      - "tests/test_generate_job_pages.py"
  # Generate and refresh dedicated job pages daily at 10:00 AM India time (04:30 UTC).
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sja-static-job-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: python -m pip install requests
      - name: Generate and safely publish crawlable job pages
        env:
          SUPABASE_URL: \${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: \${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Rebuild from the newest main on each attempt so concurrent commits
          # never leave the generated pages or one-line sitemap based on stale code.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            python scripts/generate_job_pages.py
            python scripts/generate_job_sitemap.py

            git add jobs sitemap-jobs.xml _redirects job-redirects.js
            if git diff --cached --quiet; then
              echo "Static pages and sitemap already current."
              exit 0
            fi

            git commit -m "Publish crawlable static job detail pages"
            if git push origin HEAD:main; then
              echo "Static job pages and sitemap pushed successfully."
              exit 0
            fi

            echo "Push race detected (attempt $attempt/5); rebuilding from latest main."
            sleep $((attempt * 2))
          done

          echo "Could not publish static job pages after 5 attempts."
          exit 1
