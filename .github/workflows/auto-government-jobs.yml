name: SarkariJobAlert - Automatic Government Job Scanner

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/fetch_jobs.py"
      - "tests/test_fetch_jobs.py"
      - ".github/workflows/auto-government-jobs.yml"
  schedule:
    - cron: "30 0 * * *" # Daily 06:00 IST (Asia/Kolkata)
    - cron: "35 19 * * *" # 01:05 IST daily cleanup

permissions:
  contents: write

concurrency:
  group: sja-auto-government-jobs
  cancel-in-progress: false

jobs:
  scan-and-review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade requests beautifulsoup4 pypdf certifi
          python -c "import certifi; print('TLS CA bundle:', certifi.where())"
      - name: Validate Python scanner and cleanup syntax
        run: python -m py_compile scripts/fetch_jobs.py scripts/cleanup_expired_jobs.py scripts/generate_job_sitemap.py
      - name: Run scanner regression tests
        run: python -m unittest discover -s tests -v
      - name: Scan vacancies plus UP Admit Cards/Results; auto-publish only strictly verified records
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.schedule == '30 0 * * *'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/fetch_jobs.py

      - name: Delete all expired vacancies (manual and automatic) after 30 days
        if: github.event.schedule == '35 19 * * *'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/cleanup_expired_jobs.py

      - name: Generate and safely push sitemap for published job posts
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Rebuild from the latest main on every attempt. This avoids trying
          # to merge two generated one-line XML sitemaps, which causes a
          # predictable rebase conflict when another commit lands mid-run.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            python scripts/generate_job_sitemap.py

            if [ -z "$(git status --porcelain -- sitemap-jobs.xml)" ]; then
              echo "Published jobs sitemap is already up to date."
              exit 0
            fi

            git add sitemap-jobs.xml
            git commit -m "Update published jobs sitemap"

            if git push origin HEAD:main; then
              echo "Published jobs sitemap pushed successfully."
              exit 0
            fi

            echo "Push race detected (attempt $attempt/5); fetching latest main and rebuilding sitemap."
            sleep $((attempt * 2))
          done

          echo "Could not push sitemap after 5 attempts."
          exit 1
