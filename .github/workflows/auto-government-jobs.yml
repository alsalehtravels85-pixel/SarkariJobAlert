name: SarkariJobAlert - Automatic Government Job Scanner

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/fetch_jobs.py"
      - "tests/test_fetch_jobs.py"
      - ".github/workflows/auto-government-jobs.yml"
  schedule:
    - cron: "17 */6 * * *"
    - cron: "35 19 * * *" # 01:05 IST daily cleanup

permissions:
  contents: write

concurrency:
  group: sja-auto-government-jobs
  cancel-in-progress: false

jobs:
  scan-and-review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade requests beautifulsoup4 pypdf certifi
          python -c "import certifi; print('TLS CA bundle:', certifi.where())"
      - name: Validate Python scanner and cleanup syntax
        run: python -m py_compile scripts/fetch_jobs.py scripts/cleanup_expired_jobs.py scripts/generate_job_sitemap.py
      - name: Run scanner regression tests
        run: python -m unittest discover -s tests -v
      - name: Scan vacancies plus UP Admit Cards/Results; auto-publish only strictly verified records
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.schedule == '17 */6 * * *'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/fetch_jobs.py

      - name: Delete all expired vacancies (manual and automatic) after 30 days
        if: github.event.schedule == '35 19 * * *'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/cleanup_expired_jobs.py

      - name: Generate sitemap for published job posts
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scripts/generate_job_sitemap.py
          if [ -n "$(git status --porcelain -- sitemap-jobs.xml)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sitemap-jobs.xml
            git commit -m "Update published jobs sitemap"

            # Another workflow or a manual commit may update main while this
            # run is scanning. Rebase and retry instead of failing on a
            # non-fast-forward push. If sitemap itself conflicts, regenerate
            # it from the latest published database state and retry.
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort
                python scripts/generate_job_sitemap.py
                git add sitemap-jobs.xml
                git commit --amend --no-edit
                continue
              fi

              if git push origin HEAD:main; then
                echo "Published jobs sitemap pushed successfully."
                exit 0
              fi

              echo "Push race detected (attempt $attempt/3); retrying."
            done

            echo "Could not push sitemap after 3 safe retries."
            exit 1
          else
            echo "Published jobs sitemap is already up to date."
          fi
