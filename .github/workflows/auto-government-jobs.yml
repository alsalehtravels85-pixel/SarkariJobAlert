name: SarkariJobAlert - Automatic Government Job Scanner

on:
  workflow_dispatch:
  schedule:
    # Daily at 08:00 AM India time (02:30 UTC)
    - cron: "30 2 * * *"

permissions:
  contents: write

concurrency:
  group: sja-auto-government-jobs
  cancel-in-progress: false

jobs:
  scan-and-review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade requests beautifulsoup4 pypdf certifi
          python -c "import certifi; print('TLS CA bundle:', certifi.where())"
      - name: Validate Python scanner syntax
        run: python -m py_compile scripts/fetch_jobs.py scripts/job_article_writer.py scripts/cleanup_expired_jobs.py scripts/generate_job_sitemap.py scripts/generate_job_pages.py
      - name: Run scanner regression tests
        run: python -m unittest discover -s tests -v
      - name: Scan Vacancy, Admit Card, Result and Latest Update; generate verified Hindi Drafts for human review
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.schedule == '30 2 * * *'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
          GEMINI_FALLBACK_MODEL: gemini-3.5-flash-lite
        run: python scripts/fetch_jobs.py

      - name: Unpublish expired vacancies while preserving records (manual and automatic)
        if: github.event.schedule == '35 19 * * *'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/cleanup_expired_jobs.py

      - name: Generate and safely push sitemap for published job posts
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Rebuild from the latest main on every attempt. This avoids trying
          # to merge two generated one-line XML sitemaps, which causes a
          # predictable rebase conflict when another commit lands mid-run.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            python scripts/generate_job_pages.py
            python scripts/generate_job_sitemap.py

            if [ -z "$(git status --porcelain -- jobs sitemap-jobs.xml)" ]; then
              echo "Static job pages and sitemap are already up to date."
              exit 0
            fi

            git add jobs sitemap-jobs.xml
            git commit -m "Update published jobs sitemap"

            if git push origin HEAD:main; then
              echo "Published jobs sitemap pushed successfully."
              exit 0
            fi

            echo "Push race detected (attempt $attempt/5); fetching latest main and rebuilding sitemap."
            sleep $((attempt * 2))
          done

          echo "Could not push sitemap after 5 attempts."
          exit 1
