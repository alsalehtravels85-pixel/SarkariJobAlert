name: SarkariJobAlert - Automatic Government Job Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
    - cron: "35 19 * * *" # 01:05 IST daily cleanup

permissions:
  contents: read

concurrency:
  group: sja-auto-government-jobs
  cancel-in-progress: false

jobs:
  scan-and-review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade requests beautifulsoup4 pypdf
      - name: Validate Python scanner and cleanup syntax
        run: python -m py_compile scripts/fetch_jobs.py scripts/cleanup_expired_jobs.py
      - name: Scan vacancies plus UP Admit Cards/Results; publish verified items by category rules
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 */6 * * *'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/fetch_jobs.py
      - name: Delete all expired vacancies (manual and automatic) after 30 days
        if: github.event.schedule == '35 19 * * *'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/cleanup_expired_jobs.py
