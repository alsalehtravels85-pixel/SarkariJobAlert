name: SarkariResult Read-only Access Test

on:
  push:
    branches: [main]
    paths:
      - "scripts/test_sarkariresult_readonly.py"

permissions:
  contents: read

jobs:
  read-only-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install page parser
        run: python -m pip install requests beautifulsoup4
      - name: Test SarkariResult listings and one detail page (no database writes)
        run: python scripts/test_sarkariresult_readonly.py
