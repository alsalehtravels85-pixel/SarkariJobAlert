name: SarkariResult source access experiment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install probe dependency
        run: python -m pip install requests
      - name: Test indexed discovery and direct detail access (read-only)
        run: python scripts/probe_sarkariresult_access.py
