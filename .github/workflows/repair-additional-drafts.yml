name: SarkariJobAlert - Repair additional draft posts
on:
  workflow_dispatch:
  push:
    branches: [adsense-readiness-audit]
    paths:
      - "scripts/repair_additional_drafts.py"
      - ".github/workflows/repair-additional-drafts.yml"
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: adsense-readiness-audit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests
      - name: Backup then repair and restore
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/repair_additional_drafts.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sja-pre-additional-draft-repair-backup
          path: repair-output/pre-draft-repair-backup.json
          if-no-files-found: warn
          retention-days: 30
