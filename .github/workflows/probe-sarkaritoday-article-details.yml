name: Read-only SarkariToday article detail extraction test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Extract article details (read-only)
        run: python scripts/probe_sarkaritoday_article_details.py | tee sarkaritoday-article-details-report.json
      - name: Save report
        uses: actions/upload-artifact@v4
        with:
          name: sarkaritoday-article-details-report
          path: sarkaritoday-article-details-report.json
          retention-days: 7
