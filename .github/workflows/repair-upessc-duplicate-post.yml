name: SarkariJobAlert - Correct UPESSC duplicate placeholder in place
on:
  push:
    branches: [adsense-readiness-audit]
    paths:
      - "scripts/repair_upessc_duplicate_post.py"
      - ".github/workflows/repair-upessc-duplicate-post.yml"
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: adsense-readiness-audit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Backup and correct only the published placeholder
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/repair_upessc_duplicate_post.py
      - name: Preserve backup
        uses: actions/upload-artifact@v4
        with:
          name: upessc-post-before-correction
          path: repair-output/
          if-no-files-found: error
          retention-days: 30
