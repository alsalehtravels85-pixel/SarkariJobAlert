name: SarkariJobAlert - Editorial merge and verification
on:
  workflow_dispatch:
  push:
    branches: [adsense-readiness-audit]
    paths:
      - "scripts/editorial_merge_repair.py"
      - ".github/workflows/editorial-merge-repair.yml"
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: adsense-readiness-audit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests
      - name: Backup then consolidate duplicate and clarify unverified listing
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/editorial_merge_repair.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sja-pre-editorial-merge-backup
          path: repair-output/pre-editorial-repair-backup.json
          if-no-files-found: warn
          retention-days: 30
