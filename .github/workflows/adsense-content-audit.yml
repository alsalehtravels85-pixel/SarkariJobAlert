name: SarkariJobAlert - Read-only AdSense Content Audit

on:
  workflow_dispatch:
  push:
    branches: [adsense-readiness-audit]
    paths:
      - "scripts/audit_published_jobs.py"
      - ".github/workflows/adsense-content-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: adsense-readiness-audit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audit dependency
        run: python -m pip install requests
      - name: Run read-only published content audit
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/audit_published_jobs.py
      - name: Upload review report
        uses: actions/upload-artifact@v4
        with:
          name: sarkarijobalert-adsense-content-audit
          path: audit-output/
          if-no-files-found: error
          retention-days: 14
