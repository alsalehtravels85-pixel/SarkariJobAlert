name: Read-only official notice link verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install probe dependencies
        run: python -m pip install requests beautifulsoup4 pypdf
      - name: Verify public official links and readable PDFs
        run: python scripts/probe_sarkaritoday_official_targets.py | tee sarkaritoday-official-targets-report.json
      - name: Save report
        uses: actions/upload-artifact@v4
        with:
          name: sarkaritoday-official-targets-report
          path: sarkaritoday-official-targets-report.json
          if-no-files-found: error
          retention-days: 7
