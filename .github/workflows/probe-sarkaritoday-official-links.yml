name: Read-only SarkariToday official-link discovery test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install probe dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Inspect public article links (no database access)
        run: python scripts/probe_sarkaritoday_official_links.py | tee sarkaritoday-official-links-report.json
      - name: Save report
        uses: actions/upload-artifact@v4
        with:
          name: sarkaritoday-official-links-report
          path: sarkaritoday-official-links-report.json
          if-no-files-found: error
          retention-days: 7
