name: SarkariJobAlert - Reviewed Content Cleanup
on:
  workflow_dispatch:
  push:
    branches: [adsense-readiness-audit]
    paths:
      - "scripts/quarantine_reviewed_posts.py"
      - ".github/workflows/adsense-reviewed-cleanup.yml"
permissions:
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: adsense-readiness-audit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests
      - name: Backup current published rows and move reviewed posts to Draft
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/quarantine_reviewed_posts.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sja-reviewed-cleanup-backup
          path: audit-output/pre-reviewed-cleanup-backup.json
          if-no-files-found: warn
          retention-days: 30
