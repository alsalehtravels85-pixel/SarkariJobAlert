name: Read-only FreeJobAlert access test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install probe dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Check robots and public job pages (no database access)
        run: python scripts/probe_freejobalert_access.py | tee freejobalert-probe-report.json
      - name: Save probe report
        uses: actions/upload-artifact@v4
        with:
          name: freejobalert-read-only-probe
          path: freejobalert-probe-report.json
          if-no-files-found: error
          retention-days: 7
