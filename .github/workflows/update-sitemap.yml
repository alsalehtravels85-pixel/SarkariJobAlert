name: Update SarkariJobAlert Sitemap Index

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: sja-sitemap-update
  cancel-in-progress: true

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Generate sitemap index and static pages
        run: node scripts/generate-sitemap.mjs
      - name: Commit sitemap if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml sitemap-pages.xml
          if git diff --cached --quiet; then
            echo "Sitemap files are already up to date."
          else
            git commit -m "Fix sitemap index and static sitemap"
            git push
          fi
